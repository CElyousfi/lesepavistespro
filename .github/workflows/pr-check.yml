# PR gate (S2.5): the same checks the deploy runs, on every PR to main.
name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: SEO QA check
        run: npm run seo-check
      - name: Build (runs prebuild = seo-check)
        run: npm run build
